<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Sandboxed runner: the parent uses sandbox="allow-scripts" without
    allow-same-origin, so this document has an opaque origin.

    Trust-boundary invariant:
      1. User code executes only inside this isolated iframe's Worker.
      2. The trusted Worker reporting reference is closure-only.
      3. The Worker accepts exactly one run invocation per Worker lifetime.
      4. User code has no reachable original postMessage function.
      5. Global error-handler properties are inert; synchronous errors are
         caught around user execution and Worker failures are observed by
         the outer iframe.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; worker-src blob:; connect-src 'none'; img-src 'none'; media-src 'none'; font-src 'none'; style-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>eCollab Code Sandbox</title>
</head>
<body>
<script>
'use strict';
const CHANNEL = 'ecollab-code-sandbox';

function safeString(value) {
  try {
    if (typeof value === 'string') return value;
    if (value instanceof Error) return value.message || String(value);
    const json = JSON.stringify(value);
    if (json !== undefined) return json;
  } catch (_) {}
  try { return String(value); } catch (_) { return '[unserializable value]'; }
}

function sendToParent(nonce, output, error) {
  window.parent.postMessage({
    type: 'done',
    channel: CHANNEL,
    nonce,
    output: typeof output === 'string' ? output : '',
    error: typeof error === 'string' ? error : ''
  }, '*');
}

function createWorker(code) {
  const workerSource = `
'use strict';
(() => {
  /*
   * This IIFE is the trusted side of the Worker protocol. Values declared
   * here are closure locals and are not visible to new Function() code.
   */
  const realPostMessage = self.postMessage.bind(self);
  const noop = function() {};
  let runAccepted = false;

  /*
   * Remove every reachable prototype-level copy of postMessage, not just
   * the immediate prototype. This prevents a user snippet from walking
   * the WorkerGlobalScope prototype chain and recovering the original
   * reporting channel.
   *
   * After this point the only reference to the original function is the
   * closure-local realPostMessage above; user code cannot reach that value.
   */
  let current = self;
  while (current) {
    try {
      Object.defineProperty(current, 'postMessage', {
        value: noop,
        writable: true,
        configurable: true,
        enumerable: false
      });
    } catch (_) {
      try { current.postMessage = noop; } catch (_) {}
    }
    try { current = Object.getPrototypeOf(current); } catch (_) { current = null; }
  }

  /*
   * These properties must never expose trusted reporting closures.
   * We intentionally do not install trusted onerror/onunhandledrejection
   * handlers here; real Worker failures are observed by the iframe.
   */
  try { self.onerror = noop; } catch (_) {}
  try { self.onunhandledrejection = noop; } catch (_) {}

  function stringify(value) {
    try {
      if (typeof value === 'string') return value;
      if (value instanceof Error) return value.message || String(value);
      const json = JSON.stringify(value);
      if (json !== undefined) return json;
    } catch (_) {}
    try { return String(value); } catch (_) { return '[unserializable value]'; }
  }

  /*
   * IMPORTANT: this is a single-use gate, not an isTrusted check.
   *
   * A script-created object can lie about an isTrusted property when a
   * handler is invoked as an ordinary function. Therefore isTrusted is
   * deliberately NOT used as an authorization primitive here.
   *
   * The security invariant is structural: user code cannot execute until
   * this handler has already been entered by the iframe's legitimate
   * Worker.postMessage call. At that point runAccepted is set before any
   * attacker-controlled code executes, so every direct call, saved-handler
   * call, dispatchEvent re-entry, or nested invocation is rejected.
   */
  self.onmessage = function(event) {
    if (runAccepted) return;
    runAccepted = true;

    if (!event || !event.data || event.data.type !== 'run') return;
    const source = typeof event.data.code === 'string' ? event.data.code : '';
    const lines = [];
    let reported = false;

    const report = function(output, error) {
      if (reported) return;
      reported = true;
      realPostMessage({
        type: 'worker-result',
        output: typeof output === 'string' ? output : '',
        error: typeof error === 'string' ? error : ''
      });
    };

    const fakeConsole = {
      log: (...args) => lines.push(args.map(stringify).join(' ')),
      info: (...args) => lines.push(args.map(stringify).join(' ')),
      debug: (...args) => lines.push(args.map(stringify).join(' ')),
      warn: (...args) => lines.push('WARN: ' + args.map(stringify).join(' ')),
      error: (...args) => lines.push('ERROR: ' + args.map(stringify).join(' '))
    };

    try {
      const fn = new Function('console', '"use strict";\\n' + source);
      const result = fn(fakeConsole);
      if (result !== undefined && lines.length === 0) lines.push(stringify(result));
      report(lines.join('\\n') || '(no output)', '');
    } catch (error) {
      report(
        lines.join('\\n'),
        error && error.message ? error.message : stringify(error)
      );
    }
  };
})();
`;

  const blob = new Blob([workerSource], { type: 'text/javascript' });
  const blobUrl = URL.createObjectURL(blob);
  try {
    return new Worker(blobUrl);
  } finally {
    URL.revokeObjectURL(blobUrl);
  }
}

window.addEventListener('message', function(event) {
  if (event.source !== window.parent) return;

  const data = event.data;
  if (!data || typeof data !== 'object' ||
      data.type !== 'ecollab-code-run' ||
      data.channel !== CHANNEL ||
      typeof data.nonce !== 'string' ||
      typeof data.code !== 'string') return;

  const nonce = data.nonce;
  let worker;
  try {
    worker = createWorker(data.code);
  } catch (error) {
    sendToParent(nonce, '', error && error.message ? error.message : String(error));
    return;
  }

  let settled = false;
  const finish = function(output, error) {
    if (settled) return;
    settled = true;
    try { worker.terminate(); } catch (_) {}
    sendToParent(nonce, output, error);
  };

  worker.addEventListener('message', function(workerEvent) {
    const result = workerEvent.data;
    if (!result || result.type !== 'worker-result') return;
    finish(
      typeof result.output === 'string' ? result.output : '',
      typeof result.error === 'string' ? result.error : ''
    );
  });

  worker.addEventListener('error', function(errorEvent) {
    finish('', errorEvent.message || 'Sandbox worker failed.');
  });

  worker.postMessage({ type: 'run', code: data.code });
});
</script>
</body>
</html>
