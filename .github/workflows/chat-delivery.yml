name: Chat delivery
on:
  push:
    branches: [ecollab-collabs, 'fix/realtime-throughput-*']
    paths: ['services/ChannelReadQueries.php', 'services/RealtimeDispatchMetrics.php', 'services/ChannelService.php', 'services/RealtimeOutbox.php', 'services/CentrifugoService.php', 'services/MessageService.php', 'scripts/realtime-worker.php', 'scripts/check-centrifugo.php', 'scripts/profile-chat-reads.php', 'services/ChatReadProfiler.php', 'tests/chat-read-profiler-regression.php', 'API/auth/realtime-token.php', 'API/dm/**', 'assets/js/chat/**', 'tools/chat-delivery/**', 'deploy/centrifugo/**', 'tests/centrifugo-*', 'database/migrations/052_realtime_outbox.sql', '.github/workflows/chat-delivery.yml']
  pull_request:
    paths: ['services/ChannelReadQueries.php', 'services/RealtimeDispatchMetrics.php', 'services/ChannelService.php','services/ChatReadProfiler.php','tests/chat-read-profiler-regression.php','services/Centrifugo*.php','API/internal/centrifugo-proxy.php','API/auth/realtime-token.php','deploy/centrifugo/**','tools/chat-delivery/**','tests/centrifugo-*','.github/workflows/chat-delivery.yml']
  workflow_dispatch:
jobs:
  delivery:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: delivery_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'pdo_mysql, curl'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --prefix tools/chat-delivery
      - run: npm run build --prefix tools/chat-delivery && git diff --exit-code -- assets/js/chat/centrifugo-delivery*
      - run: node tests/centrifugo-client-regression.cjs
      - run: node tests/centrifugo-http-regression.cjs
      - run: |
          docker run -d --name test-centrifugo --network=host --entrypoint /bin/sh \
            -e CENTRIFUGO_PROXY_SECRET=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            -e CENTRIFUGO_HTTP_API_KEY=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            -e CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -v "$PWD/deploy/centrifugo/config.json:/centrifugo/config.json:ro" \
            -v "$PWD/deploy/centrifugo/proxy-entrypoint.sh:/centrifugo/proxy-entrypoint.sh:ro" \
            centrifugo/centrifugo:v6.9.6 /centrifugo/proxy-entrypoint.sh
          for attempt in {1..30}; do
            curl -s -o /dev/null http://127.0.0.1:8001/api/info && break
            sleep 1
          done
          docker exec test-centrifugo centrifugo version | grep -E '^Centrifugo v6[.]9[.]6 '
      - run: php -l services/ChannelReadQueries.php && php -l services/RealtimeDispatchMetrics.php && php -l services/RealtimeOutbox.php && php -l scripts/realtime-worker.php && php -l scripts/profile-chat-reads.php && php tests/chat-read-profiler-regression.php && php tests/centrifugo-regression.php && php tests/centrifugo-database-regression.php
        env:
          TEST_BROKER_API: http://127.0.0.1:8001/api
          TEST_DELIVERY_DSN: mysql:host=127.0.0.1;dbname=delivery_test
          TEST_DELIVERY_USER: root
          TEST_DELIVERY_PASSWORD: root


  mariadb-reads:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env: {MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: delivery_test}
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: pdo_mysql}
      - run: php tests/chat-read-profiler-regression.php
        env:
          TEST_DELIVERY_DSN: mysql:host=127.0.0.1;dbname=delivery_test
          TEST_DELIVERY_USER: root
          TEST_DELIVERY_PASSWORD: root
