name: Phase 2 backend regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: ecollab_phase2_test
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring, curl, dom, posix, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --prefix tools/chat-delivery --ignore-scripts
      - name: PHP syntax and queue/search/authorization regressions
        run: |
          set -e
          find API services scripts websocket tests -name '*.php' -print0 | xargs -0 -n1 php -l
          for test in livekit-admission r7-authorization phase2-jarred phase2-livekit phase2-search phase2-websocket phase2-code-lab phase2-voice-action review-jarred-resource-access phase1-access phase1-temporary-voice phase1-peer-batch phase1-messages phase1-websocket; do php "tests/$test.php"; done
          php vendor/bin/phpunit --testsuite Unit --stderr
          python3 tests/phase1-session.py
          python3 tests/phase2-jarred-http.py
          python3 tests/r7-token-http.py
          python3 tests/r7-resource-http.py
          python3 tests/review-realtime-crash.py
      - name: Real MariaDB transactional fixtures and migrations
        env:
          PHASE2_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=ecollab_phase2_test
        run: |
          set -e
          php tests/phase2-jarred.php
          php tests/phase2-mariadb.php
          php -r '$db=new PDO("mysql:host=127.0.0.1;port=3306","root","");$db->exec("CREATE DATABASE ecollab_r7_test");'
          R7_TEST_DSN="mysql:host=127.0.0.1;port=3306;dbname=ecollab_r7_test" php tests/r7-authorization.php
          php -r '$db=new PDO("mysql:host=127.0.0.1;port=3306","root","");$db->exec("CREATE DATABASE ecollab_admission_test");'
          ADMISSION_TEST_DSN="mysql:host=127.0.0.1;port=3306;dbname=ecollab_admission_test" php tests/livekit-admission.php
      - name: Client event, backoff and regression fixtures
        env:
          NODE_PATH: ${{ github.workspace }}/tools/chat-delivery/node_modules
        run: |
          set -e
          npm run build --prefix tools/chat-delivery
          git diff --exit-code -- assets/js/chat/centrifugo-delivery.js assets/js/chat/centrifugo-delivery.NOTICES.txt
          for test in phase2-jarred-client phase2-polling code-lab-ui-regression centrifugo-client-regression livekit-voice-regression livekit-calls-regression notification-routing-regression; do node "tests/$test.cjs"; done

  media-admission-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable CI ingress dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx php8.3-fpm php8.3-sqlite3
      - name: Real Nginx and FPM authorization/outage fixture
        run: python3 tests/livekit-admission-ingress.py
