name: Load chat functionality overrides

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-chat-page:
    if: contains(github.event.head_commit.message, '[chat-functionalize]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject final chat override loader
        shell: python
        run: |
          from pathlib import Path

          path = Path('modules/chat/chat.php')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="<?= BASE_URL ?>/assets/js/chat/functionality-overrides.js" defer></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in modules/chat/chat.php')
              text = text.replace(marker, f'{tag}\n{marker}', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit injected loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/chat/chat.php
          if git diff --cached --quiet; then
            echo "Loader already present."
            exit 0
          fi
          git commit -m "load final chat functionality overrides"
          git push
