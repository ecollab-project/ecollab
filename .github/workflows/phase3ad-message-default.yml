name: Phase 3AD code and poll compatibility
on:
  pull_request:
    paths:
      - 'services/MessageService.php'
      - 'API/chat/send-message.php'
      - 'API/chat/vote-poll.php'
      - 'tests/phase3ad-message-control.php'
      - 'tests/phase3ad-enum-migration.php'
      - 'tests/phase3ad-scope.py'
      - 'database/migrations/068_message_code_poll_types.sql'
      - 'tests/phase3ad-message-compatibility.py'
      - '.github/workflows/phase3ad-message-default.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-message-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PHASE3AD_OWNED_FRESH_IDENTITY: '1'
      PHASE3AD_IDENTITY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install disposable MariaDB and PHP dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/perf-apt/empty" "$RUNNER_TEMP/perf-apt/lists/partial"
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' \
            > "$RUNNER_TEMP/perf-apt/sources.list"
          apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/perf-apt/sources.list"
            -o "Dir::Etc::sourceparts=$RUNNER_TEMP/perf-apt/empty"
            -o "Dir::State::lists=$RUNNER_TEMP/perf-apt/lists"
            -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y mariadb-server php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3 php8.3-curl php8.3-mbstring php8.3-xml
      - name: Exact source boundary and dependencies
        run: |
          python3 -B tests/phase3ad-scope.py
          php8.3 -l services/MessageService.php
          composer install --no-interaction --prefer-dist --no-progress
          git worktree add --detach "$RUNNER_TEMP/message-base" cb94769a6af87a356a069a2c949b5bd7b5c73e6e
          cp tests/phase3ad-message-compatibility.py "$RUNNER_TEMP/message-base/tests/"
          cd "$RUNNER_TEMP/message-base"
          composer install --no-interaction --prefer-dist --no-progress
      - name: Exact base real HTTP and three full suite orderings
        env:
          PHP_BIN: /usr/bin/php8.3
          PHP_FPM_BIN: /usr/sbin/php-fpm8.3
          MARIADBD_BIN: /usr/sbin/mariadbd
          PHASE3AD_MESSAGE_CONTROL: '1'
          PHASE3AD_MESSAGE_EVIDENCE: ${{ github.workspace }}/phase3ad-message-raw/base.json
        run: python3 -B "$RUNNER_TEMP/message-base/tests/phase3ad-message-compatibility.py"
      - name: Candidate real HTTP and three full suite orderings
        if: ${{ !cancelled() }}
        env:
          PHP_BIN: /usr/bin/php8.3
          PHP_FPM_BIN: /usr/sbin/php-fpm8.3
          MARIADBD_BIN: /usr/sbin/mariadbd
          PHASE3AD_MESSAGE_EVIDENCE: phase3ad-message-raw/candidate.json
        run: python3 -B tests/phase3ad-message-compatibility.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: phase3ad-message-default-evidence
          path: phase3ad-message-raw/
