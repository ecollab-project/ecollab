name: Phase 4.6 modal hotfix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-legacy-modal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch legacy modal visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('modules/chat/chat.php')
          s = p.read_text(encoding='utf-8')
          old = 'display:none;position:fixed;inset:0;z-index:11000;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:flex!important;align-items:center;justify-content:center;'
          new = 'display:none!important;position:fixed;inset:0;z-index:11000;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;'
          if old not in s:
              raise SystemExit('Legacy modal style pattern not found; no patch made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time hotfix workflow
        run: rm -f .github/workflows/phase46-modal-hotfix.yml

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/chat/chat.php .github/workflows/phase46-modal-hotfix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 4.6: remove legacy private channel modal flash'
          git push