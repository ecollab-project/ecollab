name: Jarred async privacy integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-mariadb-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install disposable MariaDB and PHP dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/cw-apt/empty" "$RUNNER_TEMP/cw-apt/lists/partial"
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' \
            > "$RUNNER_TEMP/cw-apt/sources.list"
          apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/cw-apt/sources.list"
            -o "Dir::Etc::sourceparts=$RUNNER_TEMP/cw-apt/empty"
            -o "Dir::State::lists=$RUNNER_TEMP/cw-apt/lists"
            -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y mariadb-server php8.3-cli php8.3-mysql php8.3-sqlite3 php8.3-curl php8.3-mbstring php8.3-xml
      - name: Install isolated JS and browser fixtures
        run: |
          npm install --no-save --ignore-scripts jsdom@30.1.2 playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Syntax, queue crash, permission and privacy regressions
        run: |
          set -e
          find API/dm services scripts tests -name '*.php' -print0 | xargs -0 -n1 php8.3 -l
          composer install --no-interaction --prefer-dist --no-progress
          php8.3 vendor/bin/phpunit --testsuite Unit
          php8.3 tests/phase1-access.php
          php8.3 tests/phase1-temporary-voice.php
          php8.3 tests/phase2-jarred.php
          php8.3 tests/review-jarred-crashes.php
          php8.3 tests/review-jarred-resource-access.php
          PHP_BIN=/usr/bin/php8.3 python3 tests/phase2-jarred-http.py
          node tests/phase2-jarred-client.cjs
          node tests/jarred-async-browser.cjs
      - name: Actual MariaDB, TCP faults, HTTP client and CLI worker recovery
        env:
          PHP_BIN: /usr/bin/php8.3
          MARIADBD_BIN: /usr/sbin/mariadbd
        run: python3 -u tests/jarred-async-integration.py
