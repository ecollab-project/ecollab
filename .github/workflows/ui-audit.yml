name: UI audit regressions
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: pdo_sqlite, coverage: none}
      - run: npm install --no-save --ignore-scripts jsdom@30.1.2 yjs@13.6.27 y-protocols@1.0.6
      - run: |
          node tests/ui-audit-regression.cjs
          node tests/collab-creation-ui.cjs
          node tests/code-lab-module-ui.cjs
          node tests/modal-accessibility-regression.cjs
          node tests/yjs-channel-presence-regression.cjs
          node tests/yjs-presence-regression.cjs
          node tests/socket-auth-race-regression.cjs
          node tests/channel-presence-bootstrap-regression.cjs
          node tests/whiteboard-socket-regression.cjs
          node tests/chat-navigation-regression.cjs
          node tests/chat-timeline-regression.cjs
          node tests/learning-workspace-ui-regression.cjs
          php tests/learning-workspace-regression.php
          php tests/pinned-attachments-regression.php
          php tests/peer-top-regression.php
          php tests/whiteboard-presence-regression.php
          php tests/whiteboard-scene-regression.php
          php tests/jarred-response-format.php
      - run: |
          for file in API/chat/peer-match.php modules/chat/chat.php modules/chat/settings.php modules/library/library.php modules/whiteboard/session.php services/LearningWorkspaceService.php services/MessageService.php; do php -l "$file" || exit 1; done
