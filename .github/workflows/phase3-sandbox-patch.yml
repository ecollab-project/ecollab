name: Phase 3 Sandbox Patch

on:
  push:
    branches:
      - fix/security-code-sandbox-isolation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Replace in-page JavaScript execution with sandboxed iframe execution
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path('assets/js/chat/collab-tools.js')
          text = path.read_text(encoding='utf-8')

          replacement = r'''const CODE_SANDBOX_TIMEOUT_MS = 1500;

function _runCodeInSandbox(code) {
  return new Promise((resolve) => {
    const iframe = document.createElement('iframe');
    const nonce = (window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}-${Math.random()}`);
    let finished = false;
    let timeoutId = null;

    iframe.setAttribute('sandbox', 'allow-scripts');
    iframe.setAttribute('aria-hidden', 'true');
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    iframe.style.position = 'fixed';
    iframe.style.width = '1px';
    iframe.style.height = '1px';
    iframe.style.opacity = '0';
    iframe.style.pointerEvents = 'none';
    iframe.style.border = '0';

    const cleanup = (result) => {
      if (finished) return;
      finished = true;
      if (timeoutId) clearTimeout(timeoutId);
      window.removeEventListener('message', onMessage);
      iframe.remove();
      resolve(result);
    };

    const onMessage = (event) => {
      if (event.source !== iframe.contentWindow || event.origin !== 'null') return;
      const data = event.data;
      if (!data || data.channel !== 'ecollab-code-sandbox' || data.nonce !== nonce) return;
      if (data.type !== 'done') return;
      cleanup({ output: String(data.output || ''), error: String(data.error || '') });
    };

    window.addEventListener('message', onMessage);

    iframe.onload = () => {
      if (finished || !iframe.contentWindow) return;
      iframe.contentWindow.postMessage({
        type: 'ecollab-code-run',
        nonce,
        code: String(code || ''),
      }, '*');
    };

    timeoutId = setTimeout(() => {
      cleanup({ output: '', error: `Execution timed out after ${CODE_SANDBOX_TIMEOUT_MS}ms.` });
    }, CODE_SANDBOX_TIMEOUT_MS);

    iframe.src = `${window.ECOLLAB?.baseUrl || ''}/assets/js/chat/code-sandbox-runner.js`;
    (document.body || document.documentElement).appendChild(iframe);
  });
}

async function runCode() {
  const lang   = document.getElementById('codeLang')?.value || 'javascript';
  const code   = document.getElementById('codeEditor')?.value || '';
  const outEl  = document.getElementById('codeOutput');
  if (outEl) outEl.textContent = '⏳ Running…';
  const t0 = Date.now();
  let output = '', error = '';
  try {
    if (lang === 'javascript') {
      const result = await _runCodeInSandbox(code);
      output = result.output;
      error = result.error;
    } else {
      output = `▶ ${lang} execution runs server-side.\nSave the snippet and use your dev environment.`;
    }
  } catch (e) { error = e.message; }

  const dur = Date.now() - t0;
  if (outEl) {
    outEl.textContent = error ? `⚠ Error:\n${error}` : output;
    outEl.style.color = error ? '#ef4444' : '#22c55e';
  }

  // Log the run via API for the run history panel
  const snippetId = parseInt(document.querySelector('[data-snippet-id]')?.dataset.snippetId || '0');
  if (snippetId) {
    await collabFetch('code', 'log_run', { snippet_id: snippetId, output, error, duration_ms: dur }).catch(() => {});
  }
}
window.runCode = runCode;'''

          pattern = re.compile(r"async function runCode\(\) \{.*?\n\}\nwindow\.runCode = runCode;", re.S)
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('ERROR: expected exactly one runCode function block')
          if 'new Function(' in updated or 'eval(' in updated:
              raise SystemExit('ERROR: unsafe execution primitive remains in collab-tools.js')
          path.write_text(updated, encoding='utf-8')

      - name: Verify forbidden execution primitives are absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'new[[:space:]]+Function[[:space:]]*\(|eval[[:space:]]*\(|setTimeout[[:space:]]*\([[:space:]]*["'"'"'`]' assets/js/chat/collab-tools.js
          grep -n 'sandbox.*allow-scripts\|CODE_SANDBOX_TIMEOUT_MS' assets/js/chat/collab-tools.js

      - name: Commit patched file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/chat/collab-tools.js
          if git diff --cached --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git commit -m 'fix(collab): isolate Code Sandbox execution'
          git push origin HEAD:${GITHUB_REF_NAME}
