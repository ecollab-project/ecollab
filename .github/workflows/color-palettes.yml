name: Color palettes
on:
  pull_request:
    paths: ['assets/css/color-*', 'assets/js/color-theme.js', 'assets/data/color-palettes.json', 'services/ColorPaletteService.php', 'includes/layout/**', 'modules/**', 'API/profile/settings.php', 'database/migrations/059*', 'tests/color-palettes-*', '.github/workflows/color-palettes.yml']
jobs:
  palettes:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env: {MARIADB_ROOT_PASSWORD: test-password, MARIADB_DATABASE: palettes_test}
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: pdo_mysql, coverage: none}
      - run: npm install --no-save --ignore-scripts jsdom@30.1.2 playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/build-color-palettes.py --check
      - run: node tests/color-palettes-regression.cjs
      - run: php tests/color-palettes-regression.php
        env: {PALETTE_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=palettes_test'}
      - run: node tests/color-palettes-browser.cjs
