name: Phase 4.6 one-time chat loader patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-chat-loader:
    if: github.event.head_commit.message != 'Phase 4.6: add server/channel management loader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Phase 4.6 chat loader
        shell: python
        run: |
          from pathlib import Path
          p = Path('modules/chat/chat.php')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="<?= BASE_URL ?>/assets/js/chat/peer-matching.js" defer></script>'
          loader = '<script src="<?= BASE_URL ?>/assets/js/chat/server-channel-management.js" defer></script>'
          if loader not in text:
              if marker not in text:
                  raise SystemExit('peer matching script marker not found')
              text = text.replace(marker, marker + '\n  ' + loader, 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('Phase 4.6 loader already installed')
      - name: Commit loader patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/chat/chat.php
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Phase 4.6: add server/channel management loader'
            git push
          fi
