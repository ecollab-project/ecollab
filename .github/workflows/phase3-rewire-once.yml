name: Phase 3 sandbox rewiring

on:
  push:
    branches:
      - fix/security-code-sandbox-isolation

permissions:
  contents: write

jobs:
  rewire:
    if: github.ref == 'refs/heads/fix/security-code-sandbox-isolation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite and validate Code Sandbox
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/js/chat/collab-tools.js')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r"async function runCode\(\) \{.*?\n\}\nwindow\.runCode = runCode;", re.S)

          replacement = r'''async function runCode() {
  const lang   = document.getElementById('codeLang')?.value || 'javascript';
  const code   = document.getElementById('codeEditor')?.value || '';
  const outEl  = document.getElementById('codeOutput');
  if (outEl) { outEl.textContent = '⏳ Running…'; outEl.style.color = ''; }
  const t0 = Date.now();
  let output = '', error = '';

  try {
    if (lang === 'javascript') {
      const iframe = document.createElement('iframe');
      const nonce = window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
      const runnerUrl = `${window.ECOLLAB?.baseUrl || ''}/assets/js/chat/code-sandbox-runner.html`;
      const timeoutMs = 5000;
      iframe.setAttribute('sandbox', 'allow-scripts');
      iframe.setAttribute('aria-hidden', 'true');
      iframe.tabIndex = -1;
      iframe.style.cssText = 'position:fixed;width:1px;height:1px;left:-9999px;border:0;opacity:0;pointer-events:none;';
      iframe.referrerPolicy = 'strict-origin';

      const result = await new Promise((resolve) => {
        let settled = false;
        let timer = null;

        const cleanup = () => {
          if (timer) clearTimeout(timer);
          window.removeEventListener('message', onMessage);
          iframe.remove();
        };

        const finish = (value) => {
          if (settled) return;
          settled = true;
          cleanup();
          resolve(value);
        };

        const onMessage = (event) => {
          if (event.source !== iframe.contentWindow || event.origin !== 'null') return;
          const data = event.data;
          if (!data || data.channel !== 'ecollab-code-sandbox' || data.nonce !== nonce || data.type !== 'done') return;
          finish({ output: String(data.output || ''), error: String(data.error || '') });
        };

        window.addEventListener('message', onMessage);

        iframe.addEventListener('load', () => {
          if (!iframe.contentWindow) {
            finish({ output: '', error: 'Sandbox failed to initialize.' });
            return;
          }
          iframe.contentWindow.postMessage({
            type: 'ecollab-code-run',
            channel: 'ecollab-code-sandbox',
            nonce,
            code,
            parentOrigin: window.location.origin,
          }, '*');
        }, { once: true });

        iframe.addEventListener('error', () => {
          finish({ output: '', error: 'Sandbox failed to load.' });
        }, { once: true });

        timer = setTimeout(() => {
          finish({ output: '', error: `Execution timed out after ${timeoutMs / 1000} seconds.` });
        }, timeoutMs);

        iframe.src = runnerUrl;
        document.body.appendChild(iframe);
      });

      output = result.output;
      error = result.error;
    } else {
      output = `▶ ${lang} execution runs server-side.\nSave the snippet and use your dev environment.`;
    }
  } catch (e) { error = e?.message || String(e); }

  const dur = Date.now() - t0;
  if (outEl) {
    outEl.textContent = error ? `⚠ Error:\n${error}` : output;
    outEl.style.color = error ? '#ef4444' : '#22c55e';
  }

  // Log the run via API for the run history panel
  const snippetId = parseInt(document.querySelector('[data-snippet-id]')?.dataset.snippetId || '0');
  if (snippetId) {
    await collabFetch('code', 'log_run', { snippet_id: snippetId, output, error, duration_ms: dur }).catch(() => {});
  }
}
window.runCode = runCode;'''

          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one runCode block, found {count}')
          if 'new Function(' in new_text or 'eval(' in new_text:
              raise SystemExit('Unsafe execution primitive remains in collab-tools.js')
          if 'sandbox', 'allow-scripts' not in new_text:
              raise SystemExit('Sandbox validation failed')
          path.write_text(new_text, encoding='utf-8')
          PY

          grep -n "new Function\|eval(" assets/js/chat/collab-tools.js && exit 1 || true
          grep -n "sandbox.*allow-scripts" assets/js/chat/collab-tools.js
          grep -n "allow-same-origin" assets/js/chat/collab-tools.js && exit 1 || true
          git diff --check

      - name: Commit application change and remove one-shot workflow together
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/chat/collab-tools.js
          git rm .github/workflows/phase3-rewire-once.yml
          git diff --cached --check
          git commit -m "fix(collab): isolate Code Sandbox execution"
          git push origin HEAD:fix/security-code-sandbox-isolation
