name: Phase 3W telemetry schema and write-aware profiling
on:
  pull_request:
    paths:
      - 'services/StudentDashboardService.php'
      - 'tests/classroom-*'
      - 'tests/dashboard-profile.php'
      - 'tests/phase3w-*'
      - '.github/workflows/phase3w-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-fpm-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install disposable MariaDB and PHP dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/perf-apt/empty" "$RUNNER_TEMP/perf-apt/lists/partial"
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' \
            > "$RUNNER_TEMP/perf-apt/sources.list"
          apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/perf-apt/sources.list"
            -o "Dir::Etc::sourceparts=$RUNNER_TEMP/perf-apt/empty"
            -o "Dir::State::lists=$RUNNER_TEMP/perf-apt/lists"
            -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y mariadb-server php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3 php8.3-curl php8.3-mbstring php8.3-xml
      - name: Unit and focused existing regressions
        run: |
          set -e
          composer install --no-interaction --prefer-dist --no-progress
          git diff --exit-code e818bbd84ae85d67aa71a38460fe154a5128a930 -- services API database assets
          php8.3 -l services/StudentDashboardService.php
          php8.3 -l tests/classroom-bootstrap.php
          php8.3 -l tests/phase3w-telemetry-regression.php
          php8.3 tests/phase3w-telemetry-regression.php
          php8.3 -d session.save_path=/tmp -d output_buffering=4096 vendor/bin/phpunit --testsuite Unit
          php8.3 tests/peer-ml-regression.php
          php8.3 tests/learning-tools-regression.php
          php8.3 tests/learning-workspace-regression.php
          php8.3 tests/settings-runtime-regression.php
          php8.3 tests/phase2-jarred.php
          php8.3 tests/chat-upload-access-regression.php
      - name: JavaScript workspace and dashboard regressions
        run: |
          npm install --no-save --no-package-lock jsdom
          node tests/learning-workspace-ui-regression.cjs
          node tests/ai-dashboard-regression.cjs
          node tests/dashboard-date-regression.cjs
      - name: Schema inventory and full-suite exact-base comparison (retain failures)
        env:
          PHP_BIN: /usr/bin/php8.3
          MARIADBD_BIN: /usr/sbin/mariadbd
          CLASSROOM_BASE: e818bbd84ae85d67aa71a38460fe154a5128a930
          CLASSROOM_PHASE3W_SCHEMA: '1'
          PHASE3W_FULL_PHPUNIT: '1'
          CLASSROOM_FIXED_CLOCK: '1792800000'
          CLASSROOM_EVIDENCE: phase3w-raw/schema.json
          TZ: UTC
        run: python3 -B -u tests/classroom-performance.py
      - name: Native MariaDB telemetry binding and error contracts
        env:
          PHP_BIN: /usr/bin/php8.3
          MARIADBD_BIN: /usr/sbin/mariadbd
          CLASSROOM_BASE: e818bbd84ae85d67aa71a38460fe154a5128a930
          CLASSROOM_PHASE3W_TELEMETRY: '1'
          CLASSROOM_EVIDENCE: phase3w-raw/telemetry.json
        run: python3 -B -u tests/classroom-performance.py
      - name: Existing native Student Dashboard regressions
        env:
          PHP_BIN: /usr/bin/php8.3
          MARIADBD_BIN: /usr/sbin/mariadbd
          CLASSROOM_BASE: e818bbd84ae85d67aa71a38460fe154a5128a930
          CLASSROOM_PHASE3V_REGRESSION_ONLY: '1'
          CLASSROOM_EVIDENCE: phase3w-raw/existing-native.json
          TZ: UTC
        run: python3 -B -u tests/classroom-performance.py
      - name: Eight identical-source minimal/full schema read-write controls
        env:
          PHP_BIN: /usr/bin/php8.3
          PHP_FPM_BIN: /usr/sbin/php-fpm8.3
          MARIADBD_BIN: /usr/sbin/mariadbd
          PHASE3W_OUTPUT: phase3w-raw
          PHASE3W_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B -u tests/phase3w-compare.py
      - name: Full static comparison against exact Phase 3V base
        env:
          PHP_BIN: /usr/bin/php8.3
          PEER_THREADS_BASE: e818bbd84ae85d67aa71a38460fe154a5128a930
          PEER_THREADS_STATIC_EVIDENCE: phase3w-raw/static.json
        run: python3 -B -u tests/peer-threads-static.py
      - name: Keep lossless raw archives without duplicate expanded JSON
        if: success()
        run: |
          python3 - <<'PY'
          import pathlib
          for folder in ['phase3w-raw']:
              for p in pathlib.Path(folder).glob('*.json'):
                  if p.name[0].isdigit():
                      p.unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3w-owned-fpm-evidence
          path: |
            phase3w-raw/
