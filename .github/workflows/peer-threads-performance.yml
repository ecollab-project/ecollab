name: Peer matching and thread SQL performance
on:
  pull_request:
    paths:
      - 'API/chat/peer-match.php'
      - 'API/threads/index.php'
      - 'services/PeerMatchBatch.php'
      - 'services/PeerMatchingService.php'
      - 'tests/peer-ml-regression.php'
      - 'services/ThreadAttachmentService.php'
      - 'tests/peer-threads-*'
      - '.github/workflows/peer-threads-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install disposable MariaDB and PHP dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/perf-apt/empty" "$RUNNER_TEMP/perf-apt/lists/partial"
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' \
            > "$RUNNER_TEMP/perf-apt/sources.list"
          apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/perf-apt/sources.list"
            -o "Dir::Etc::sourceparts=$RUNNER_TEMP/perf-apt/empty"
            -o "Dir::State::lists=$RUNNER_TEMP/perf-apt/lists"
            -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y mariadb-server php8.3-cli php8.3-mysql php8.3-sqlite3 php8.3-curl php8.3-mbstring php8.3-xml
      - name: Existing unit, peer, facilitator, settings, attachment and Jarred regressions
        run: |
          set -e
          composer install --no-interaction --prefer-dist --no-progress
          for file in API/chat/peer-match.php API/threads/index.php services/PeerMatchBatch.php services/ThreadAttachmentService.php tests/peer-threads-{bootstrap,regression}.php; do php8.3 -l "$file"; done
          php8.3 vendor/bin/phpunit --testsuite Unit
          php8.3 tests/peer-ml-regression.php
          php8.3 tests/learning-tools-regression.php
          php8.3 tests/learning-workspace-regression.php
          php8.3 tests/settings-runtime-regression.php
          php8.3 tests/phase2-jarred.php
          php8.3 tests/chat-upload-access-regression.php
          npm install --no-save --ignore-scripts jsdom@30.1.2
          PHP_BIN=/usr/bin/php8.3 node tests/learning-workspace-ui-regression.cjs
      - name: Alternating actual API equivalence, SQL profile and batch transaction fixtures
        env:
          PHP_BIN: /usr/bin/php8.3
          MARIADBD_BIN: /usr/sbin/mariadbd
          PEER_THREADS_EVIDENCE: peer-threads-evidence.json
          PEER_THREADS_BASE: d3748527d77ac471ace8613f2a2bfb2a6c45627c
          PEER_THREADS_PHASE3R: '1'
          PEER_THREADS_SAMPLES: '12'
        run: python3 -B -u tests/peer-threads-performance.py
      - name: Full base and candidate static analysis, reject added diagnostics
        env:
          PHP_BIN: /usr/bin/php8.3
          PEER_THREADS_BASE: d3748527d77ac471ace8613f2a2bfb2a6c45627c
        run: python3 -B -u tests/peer-threads-static.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peer-threads-owned-evidence
          path: |
            peer-threads-evidence.json
            peer-threads-static.json
