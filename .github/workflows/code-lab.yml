name: Code Lab isolation
on:
  pull_request:
    paths: ['examples/code-lab/**', 'services/CodeLab*.php', 'API/code-lab/**', 'modules/code-lab/**', 'assets/js/code-lab*.js', 'assets/css/code-lab.css', 'tests/code-lab*', 'database/migrations/*code_lab*.sql', 'deploy/code-lab/**', 'scripts/*code-lab*', 'deploy/code-lab/application.env.example', '.github/workflows/code-lab.yml']
permissions:
  contents: read
jobs:
  private-attempts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, dom, curl, mbstring
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          php -l services/CodeLabService.php
          php -l API/code-lab/index.php
          php -l modules/code-lab/index.php
          php tests/code-lab-regression.php
          php -l services/CodeLabRunner.php
          php -l services/CodeLabExecutionService.php
          php -l scripts/code-lab-worker.php
          php -l scripts/check-code-lab-runner.php
          php tests/code-lab-execution-regression.php
          bash -n deploy/code-lab/bootstrap-judge0.sh
          node --check assets/js/code-lab.js
          node --check assets/js/code-lab-integrity.js
          php -l services/CodeLabIntegrityPolicy.php
          php tests/code-lab-integrity-policy.php
      - run: npm install --no-save --ignore-scripts jsdom@30.1.2 playwright@1.58.2
      - run: node tests/code-lab-ui-regression.cjs
      - run: node tests/code-lab-integrity-regression.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/code-lab-integrity-browser.cjs
