name: Phase 3 sandbox rewire

on:
  push:
    branches:
      - fix/security-code-sandbox-isolation

permissions:
  contents: write

jobs:
  rewire:
    if: github.ref == 'refs/heads/fix/security-code-sandbox-isolation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite Code Sandbox execution path
        env:
          BRANCH: fix/security-code-sandbox-isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          collab = Path('assets/js/chat/collab-tools.js')
          text = collab.read_text(encoding='utf-8')

          pattern = re.compile(r"async function runCode\(\) \{.*?\n\}\nwindow\.runCode = runCode;", re.S)
          replacement = r'''async function runCode() {
  const lang = document.getElementById('codeLang')?.value || 'javascript';
  const code = document.getElementById('codeEditor')?.value || '';
  const outEl = document.getElementById('codeOutput');
  if (outEl) { outEl.textContent = '⏳ Running…'; outEl.style.color = ''; }
  const t0 = Date.now();
  let output = '', error = '';

  try {
    if (lang === 'javascript') {
      const iframe = document.createElement('iframe');
      const nonce = (window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`);
      const runnerUrl = `${window.ECOLLAB?.baseUrl || ''}/assets/js/chat/code-sandbox-runner.html`;
      iframe.setAttribute('sandbox', 'allow-scripts');
      iframe.setAttribute('aria-hidden', 'true');
      iframe.tabIndex = -1;
      iframe.style.cssText = 'position:fixed;width:1px;height:1px;left:-9999px;border:0;opacity:0;pointer-events:none;';
      iframe.referrerPolicy = 'strict-origin';

      const result = await new Promise((resolve) => {
        let settled = false;
        const timeoutMs = 5000;
        let timer = null;

        const cleanup = () => {
          if (timer) clearTimeout(timer);
          window.removeEventListener('message', onMessage);
          iframe.remove();
        };

        const finish = (value) => {
          if (settled) return;
          settled = true;
          cleanup();
          resolve(value);
        };

        const onMessage = (event) => {
          if (event.source !== iframe.contentWindow || event.origin !== 'null') return;
          const data = event.data;
          if (!data || data.channel !== 'ecollab-code-sandbox' || data.nonce !== nonce || data.type !== 'done') return;
          finish({ output: String(data.output || ''), error: String(data.error || '') });
        };

        window.addEventListener('message', onMessage);
        iframe.addEventListener('load', () => {
          if (!iframe.contentWindow) return finish({ output: '', error: 'Sandbox failed to initialize.' });
          iframe.contentWindow.postMessage({
            type: 'ecollab-code-run',
            channel: 'ecollab-code-sandbox',
            nonce,
            code,
            parentOrigin: window.location.origin,
          }, '*');
        }, { once: true });

        timer = setTimeout(() => {
          finish({ output: '', error: `Execution timed out after ${timeoutMs / 1000} seconds.` });
        }, timeoutMs);

        iframe.src = runnerUrl;
        document.body.appendChild(iframe);
      });

      output = result.output;
      error = result.error;
    } else {
      output = `▶ ${lang} execution runs server-side.\nSave the snippet and use your dev environment.`;
    }
  } catch (e) { error = e?.message || String(e); }

  const dur = Date.now() - t0;
  if (outEl) {
    outEl.textContent = error ? `⚠ Error:\n${error}` : output;
    outEl.style.color = error ? '#ef4444' : '#22c55e';
  }

  const snippetId = parseInt(document.querySelector('[data-snippet-id]')?.dataset.snippetId || '0');
  if (snippetId) {
    await collabFetch('code', 'log_run', { snippet_id: snippetId, output, error, duration_ms: dur }).catch(() => {});
  }
}
window.runCode = runCode;'''

          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Expected exactly one runCode block in collab-tools.js')
          if 'new Function(' in new_text or 'eval(' in new_text:
              raise SystemExit('Unsafe execution primitive remains in collab-tools.js')
          collab.write_text(new_text, encoding='utf-8')

          runner = Path('assets/js/chat/code-sandbox-runner.js')
          runner.write_text(r'''\'use strict\';

/* Runs only inside iframe sandbox="allow-scripts" without allow-same-origin. */
(() => {
  const channel = 'ecollab-code-sandbox';
  let activeNonce = null;
  let idleTimer = null;
  let finished = false;

  const parentOrigin = (() => {
    try { return new URL(document.referrer).origin; } catch (_) { return ''; }
  })();

  const send = (nonce, type, payload = {}) => {
    window.parent.postMessage({ channel, nonce, type, ...payload }, '*');
  };

  const finish = (error = '') => {
    if (finished || !activeNonce) return;
    finished = true;
    if (idleTimer) clearTimeout(idleTimer);
    send(activeNonce, 'done', {
      output: lines.join('\\n') || '(no output)',
      error: error ? String(error) : '',
    });
  };

  const lines = [];
  const pushLine = (level, args) => {
    const text = args.map((value) => {
      try {
        if (typeof value === 'string') return value;
        return JSON.stringify(value);
      } catch (_) { return String(value); }
    }).join(' ');
    lines.push(level === 'log' ? text : `${level.toUpperCase()}: ${text}`);
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => finish(), 100);
  };

  const fakeConsole = Object.freeze({
    log: (...args) => pushLine('log', args),
    warn: (...args) => pushLine('warn', args),
    error: (...args) => pushLine('error', args),
    info: (...args) => pushLine('log', args),
  });

  window.onerror = (message) => { finish(message); return true; };
  window.onunhandledrejection = (event) => {
    finish(event.reason?.message || event.reason || 'Unhandled promise rejection');
  };

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    if (!parentOrigin || event.origin !== parentOrigin) return;

    const data = event.data;
    if (!data || data.channel !== channel || data.type !== 'ecollab-code-run' || typeof data.nonce !== 'string') return;
    if (data.parentOrigin !== parentOrigin || typeof data.code !== 'string') return;
    if (activeNonce || finished) return;

    activeNonce = data.nonce;
    window.console = fakeConsole;
    try {
      const script = document.createElement('script');
      script.textContent = data.code;
      document.documentElement.appendChild(script);
      if (!finished && !idleTimer) idleTimer = setTimeout(() => finish(), 100);
    } catch (error) { finish(error?.message || error); }
  });
})();
'''.replace("\\'", "'"), encoding='utf-8')

          html = Path('assets/js/chat/code-sandbox-runner.html')
          html.write_text('''<!doctype html>\n<html lang="en">\n<head><meta charset="utf-8"><meta name="referrer" content="origin"></head>\n<body><script src="code-sandbox-runner.js"></script></body>\n</html>\n''', encoding='utf-8')

          Path('.github/workflows/phase3-rewire.yml').unlink()
          PY

      - name: Commit rewritten sandbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/chat/collab-tools.js assets/js/chat/code-sandbox-runner.js assets/js/chat/code-sandbox-runner.html .github/workflows/phase3-rewire.yml
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No changes produced'; exit 1; } || true
          git commit -m "fix(collab): isolate Code Sandbox execution"
          git push origin "$BRANCH"
