services:
  centrifugo:
    image: centrifugo/centrifugo:v6.9.6
    container_name: ecollab-centrifugo
    entrypoint: ["/bin/sh", "/centrifugo/proxy-entrypoint.sh"]
    restart: unless-stopped
    network_mode: host
    env_file: centrifugo.env
    volumes:
      - ./config.json:/centrifugo/config.json:ro
      - ./proxy-entrypoint.sh:/centrifugo/proxy-entrypoint.sh:ro
    mem_limit: 256m
    cpus: 0.50
    security_opt: ["no-new-privileges:true"]
